AWSTemplateFormatVersion: "2010-09-09"
Description: AURA hair analysis SQS worker, autoscaling, and retention cleanup.

Parameters:
  ProjectName:
    Type: String
    Default: aura-hair
    AllowedPattern: "[a-zA-Z0-9-]+"
  ClusterName:
    Type: String
    Default: aura-backend-dev
  EnvironmentName:
    Type: String
    Default: dev
  ContainerImage:
    Type: String
    Description: Immutable ECR image URI for the shared API/worker image.
  WorkerContainerName:
    Type: String
    Default: aura-hair-worker
  ExecutionRoleArn:
    Type: String
    Description: ECS execution role ARN with ECR, Logs, and configured Secrets Manager access.
  ApiTaskRoleName:
    Type: String
    Default: ""
    Description: Optional existing API ECS task role name to grant sqs:SendMessage.
  WorkerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets with database and AWS service connectivity.
  WorkerSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Worker security groups with database and HTTPS egress access.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Match the existing API service. Prefer DISABLED with NAT or VPC endpoints.
  DataBucketName:
    Type: String
  HairStyleAssetBucketName:
    Type: String
    Default: ""
    Description: Optional separate style asset bucket. Empty uses DataBucketName.
  HairStyleAssetPrefix:
    Type: String
    Default: catalog/hair-styles/v1
  DatabaseUrlSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional ECS secret ValueFrom for DATABASE_URL.
  DatabaseSecretIdSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional ECS secret ValueFrom for DATABASE_SECRET_ID.
  DbHostSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
  DbPortSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
  DbNameSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
  DbSslmodeSecretValueFrom:
    Type: String
    Default: ""
    NoEcho: true
  DatabaseCredentialSecretArn:
    Type: String
    Default: ""
    Description: Secret ARN read by the worker when DATABASE_SECRET_ID is used.
  OpenAISecretValueFrom:
    Type: String
    NoEcho: true
    Description: ECS secret ValueFrom for OPENAI_API_KEY.
  WorkerCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
  WorkerMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "3072", "4096"]
  CpuArchitecture:
    Type: String
    Default: X86_64
    AllowedValues: [X86_64, ARM64]
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasApiTaskRole: !Not [!Equals [!Ref ApiTaskRoleName, ""]]
  HasSeparateStyleBucket: !Not [!Equals [!Ref HairStyleAssetBucketName, ""]]
  HasDatabaseUrlSecret: !Not [!Equals [!Ref DatabaseUrlSecretValueFrom, ""]]
  HasDatabaseSecretIdSecret: !Not [!Equals [!Ref DatabaseSecretIdSecretValueFrom, ""]]
  HasDbHostSecret: !Not [!Equals [!Ref DbHostSecretValueFrom, ""]]
  HasDbPortSecret: !Not [!Equals [!Ref DbPortSecretValueFrom, ""]]
  HasDbNameSecret: !Not [!Equals [!Ref DbNameSecretValueFrom, ""]]
  HasDbSslmodeSecret: !Not [!Equals [!Ref DbSslmodeSecretValueFrom, ""]]
  HasDatabaseCredentialSecret: !Not [!Equals [!Ref DatabaseCredentialSecretArn, ""]]

Rules:
  RequireDatabaseConfiguration:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref DatabaseUrlSecretValueFrom, ""]]
          - !Not [!Equals [!Ref DatabaseSecretIdSecretValueFrom, ""]]
        AssertDescription: Provide DATABASE_URL or DATABASE_SECRET_ID as an ECS secret reference.
  RequireDatabaseRuntimePermission:
    RuleCondition: !Not [!Equals [!Ref DatabaseSecretIdSecretValueFrom, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseCredentialSecretArn, ""]]
        AssertDescription: DatabaseCredentialSecretArn is required when DATABASE_SECRET_ID is used.

Resources:
  HairJobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-jobs-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  HairJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-jobs
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HairJobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  HairWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${ProjectName}-worker
      RetentionInDays: !Ref LogRetentionDays

  HairWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ProjectName}-worker-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt HairJobsQueue.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-analysis-source/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-analysis-mask/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-simulation-result/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !If
                  - HasSeparateStyleBucket
                  - !Sub arn:${AWS::Partition}:s3:::${HairStyleAssetBucketName}/${HairStyleAssetPrefix}/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/${HairStyleAssetPrefix}/*
              - Effect: Allow
                Action: s3:GetBucketVersioning
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucketName}
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucketName}
                Condition:
                  StringLike:
                    s3:prefix:
                      - uploads/hair-analysis-source/*
                      - uploads/hair-analysis-mask/*
                      - uploads/hair-simulation-result/*
              - !If
                - HasDatabaseCredentialSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DatabaseCredentialSecretArn
                - !Ref AWS::NoValue

  ApiQueueSendPolicy:
    Type: AWS::IAM::Policy
    Condition: HasApiTaskRole
    Properties:
      PolicyName: !Sub ${ProjectName}-api-queue-send
      Roles:
        - !Ref ApiTaskRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt HairJobsQueue.Arn
          - Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObject
              - s3:PutObject
              - s3:PutObjectTagging
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-analysis-source/*
              - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-analysis-mask/*
              - !Sub arn:${AWS::Partition}:s3:::${DataBucketName}/uploads/hair-simulation-result/*
          - Effect: Allow
            Action: s3:GetBucketVersioning
            Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucketName}
          - Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucketName}
            Condition:
              StringLike:
                s3:prefix:
                  - uploads/hair-analysis-source/*
                  - uploads/hair-analysis-mask/*
                  - uploads/hair-simulation-result/*

  HairWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-worker
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !GetAtt HairWorkerTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: !Ref WorkerContainerName
          Image: !Ref ContainerImage
          Essential: true
          Command: ["python", "-m", "app.workers.hair_simulation"]
          StopTimeout: 30
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_USE_IAM_ROLE
              Value: "true"
            - Name: HAIR_JOBS_QUEUE_URL
              Value: !Ref HairJobsQueue
            - Name: HAIR_SEGMENTER_MODEL_PATH
              Value: /app/models/hair_segmenter.tflite
            - Name: HAIR_SOURCE_RETENTION_HOURS
              Value: "24"
            - Name: HAIR_SIMULATIONS_PER_ANALYSIS
              Value: "3"
            - Name: HAIR_SIMULATIONS_PER_DAY
              Value: "6"
            - Name: HAIR_WORKER_WAIT_TIME_SECONDS
              Value: "20"
            - Name: HAIR_WORKER_VISIBILITY_TIMEOUT_SECONDS
              Value: "360"
            - Name: HAIR_WORKER_REQUEST_TIMEOUT_SECONDS
              Value: "180"
            - Name: HAIR_GENERATION_QUALITY
              Value: medium
            - Name: HAIR_STYLE_ASSETS_REQUIRE_APPROVAL
              Value: "true"
            - Name: HAIR_STYLE_ASSET_PREFIX
              Value: !Ref HairStyleAssetPrefix
            - Name: HAIR_STYLE_ASSET_BUCKET
              Value: !If [HasSeparateStyleBucket, !Ref HairStyleAssetBucketName, !Ref DataBucketName]
            - Name: S3_BUCKET_NAME
              Value: !Ref DataBucketName
          Secrets:
            - !If
              - HasDatabaseUrlSecret
              - Name: DATABASE_URL
                ValueFrom: !Ref DatabaseUrlSecretValueFrom
              - !Ref AWS::NoValue
            - !If
              - HasDatabaseSecretIdSecret
              - Name: DATABASE_SECRET_ID
                ValueFrom: !Ref DatabaseSecretIdSecretValueFrom
              - !Ref AWS::NoValue
            - !If
              - HasDbHostSecret
              - Name: DB_HOST
                ValueFrom: !Ref DbHostSecretValueFrom
              - !Ref AWS::NoValue
            - !If
              - HasDbPortSecret
              - Name: DB_PORT
                ValueFrom: !Ref DbPortSecretValueFrom
              - !Ref AWS::NoValue
            - !If
              - HasDbNameSecret
              - Name: DB_NAME
                ValueFrom: !Ref DbNameSecretValueFrom
              - !Ref AWS::NoValue
            - !If
              - HasDbSslmodeSecret
              - Name: DB_SSLMODE
                ValueFrom: !Ref DbSslmodeSecretValueFrom
              - !Ref AWS::NoValue
            - Name: OPENAI_API_KEY
              ValueFrom: !Ref OpenAISecretValueFrom
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref HairWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  HairWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${ProjectName}-worker
      Cluster: !Ref ClusterName
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref HairWorkerTaskDefinition
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups: !Ref WorkerSecurityGroupIds
          Subnets: !Ref WorkerSubnetIds

  HairWorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: HairWorkerService
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub service/${ClusterName}/${ProjectName}-worker
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  HairWorkerQueueScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-queue-backlog
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref HairWorkerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1
        ScaleInCooldown: 300
        ScaleOutCooldown: 30
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Statistic: Average
          Unit: Count
          Dimensions:
            - Name: QueueName
              Value: !GetAtt HairJobsQueue.QueueName

  HairCleanupEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ProjectName}-scheduled-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref HairWorkerTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref ExecutionRoleArn
                  - !GetAtt HairWorkerTaskRole.Arn

  HairCleanupSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Delete expired hair source, mask, and unsaved result objects.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: HairCleanupEcsTask
          Arn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
          RoleArn: !GetAtt HairCleanupEventRole.Arn
          Input: !Sub >-
            {"containerOverrides":[{"name":"${WorkerContainerName}","command":["python","-m","app.ops.cleanup_hair_media","--limit","500"]}]}
          EcsParameters:
            TaskDefinitionArn: !Ref HairWorkerTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: !Ref AssignPublicIp
                SecurityGroups: !Ref WorkerSecurityGroupIds
                Subnets: !Ref WorkerSubnetIds

Outputs:
  HairJobsQueueUrl:
    Value: !Ref HairJobsQueue
  HairJobsQueueArn:
    Value: !GetAtt HairJobsQueue.Arn
  HairJobsDeadLetterQueueUrl:
    Value: !Ref HairJobsDeadLetterQueue
  HairJobsDeadLetterQueueArn:
    Value: !GetAtt HairJobsDeadLetterQueue.Arn
  HairWorkerServiceName:
    Value: !Sub ${ProjectName}-worker
  HairWorkerTaskDefinitionArn:
    Value: !Ref HairWorkerTaskDefinition
  HairWorkerLogGroupName:
    Value: !Ref HairWorkerLogGroup
