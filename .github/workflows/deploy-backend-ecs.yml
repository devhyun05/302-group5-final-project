name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - "docs/backend/schema.sql"
      - "docs/backend/seed.sql"
      - "data/auradin/catalog/**"
      - "data/auradin/knowledge/**"
      - ".github/workflows/deploy-backend-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aura-backend-api' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'aura-backend-api' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || vars.ECS_SERVICE }}
  CHIME_ENABLED: ${{ vars.CHIME_ENABLED || 'false' }}
  CONSULTING_CALL_ENFORCE_EARLY_WINDOW: ${{ vars.CONSULTING_CALL_ENFORCE_EARLY_WINDOW || 'true' }}
  CONSULTING_CALL_TRANSCRIPTION_ENABLED: ${{ vars.CONSULTING_CALL_TRANSCRIPTION_ENABLED || 'false' }}
  CONSULTING_CALL_TRANSLATION_ENABLED: ${{ vars.CONSULTING_CALL_TRANSLATION_ENABLED || 'false' }}
  HAIR_STACK_NAME: ${{ vars.HAIR_STACK_NAME }}
  HAIR_JOBS_QUEUE_URL: ${{ vars.HAIR_JOBS_QUEUE_URL }}
  HAIR_WORKER_CONTAINER_NAME: ${{ vars.HAIR_WORKER_CONTAINER_NAME || 'aura-hair-worker' }}
  HAIR_WORKER_SERVICE: ${{ vars.HAIR_WORKER_SERVICE }}
  HAIR_WORKER_TASK_DEFINITION: ${{ vars.HAIR_WORKER_TASK_DEFINITION || vars.HAIR_WORKER_SERVICE }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    name: Build image and deploy service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt

      - name: Run backend security and regression tests
        env:
          AURA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        working-directory: services/backend
        run: python -m pytest -q

      - name: Validate deployment configuration
        run: |
          missing=()
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_CONTAINER_NAME ECS_SERVICE ECS_TASK_DEFINITION; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve hair worker deployment
        id: resolve-hair
        run: |
          service="$HAIR_WORKER_SERVICE"
          task_definition="$HAIR_WORKER_TASK_DEFINITION"
          queue_url="$HAIR_JOBS_QUEUE_URL"

          if [ -n "$HAIR_STACK_NAME" ]; then
            outputs="$(aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$HAIR_STACK_NAME" \
              --query 'Stacks[0].Outputs' \
              --output json)"
            service="$(jq -r '.[] | select(.OutputKey == "HairWorkerServiceName") | .OutputValue' <<<"$outputs")"
            task_definition="$(jq -r '.[] | select(.OutputKey == "HairWorkerTaskDefinitionArn") | .OutputValue' <<<"$outputs")"
            queue_url="$(jq -r '.[] | select(.OutputKey == "HairJobsQueueUrl") | .OutputValue' <<<"$outputs")"
          fi

          if [ -z "$service" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$task_definition" ] || [ -z "$queue_url" ]; then
            printf 'Hair deployment requires a worker task definition and HAIR_JOBS_QUEUE_URL.\n' >&2
            exit 1
          fi

          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "task-definition=$task_definition" >> "$GITHUB_OUTPUT"
          echo "queue-url=$queue_url" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          latest_uri="$REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            -f services/backend/Dockerfile \
            -t "$image_uri" \
            -t "$latest_uri" \
            .

          docker push "$image_uri"
          docker push "$latest_uri"

          echo "image=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.raw.json > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            CHIME_ENABLED=${{ env.CHIME_ENABLED }}
            CONSULTING_CALL_ENFORCE_EARLY_WINDOW=${{ env.CONSULTING_CALL_ENFORCE_EARLY_WINDOW }}
            CONSULTING_CALL_TRANSCRIPTION_ENABLED=${{ env.CONSULTING_CALL_TRANSCRIPTION_ENABLED }}
            CONSULTING_CALL_TRANSLATION_ENABLED=${{ env.CONSULTING_CALL_TRANSLATION_ENABLED }}

      - name: Connect hair queue to API task definition
        if: ${{ steps.resolve-hair.outputs.enabled == 'true' }}
        env:
          RENDERED_TASK_DEFINITION: ${{ steps.render-task-definition.outputs.task-definition }}
          HAIR_QUEUE_URL: ${{ steps.resolve-hair.outputs.queue-url }}
        run: |
          jq --arg container "$ECS_CONTAINER_NAME" --arg queue_url "$HAIR_QUEUE_URL" '
            .containerDefinitions |= map(
              if .name == $container then
                .environment = (
                  ((.environment // []) | map(select(.name != "HAIR_JOBS_QUEUE_URL")))
                  + [{"name": "HAIR_JOBS_QUEUE_URL", "value": $queue_url}]
                )
              else . end
            )
          ' "$RENDERED_TASK_DEFINITION" > task-definition.with-hair.json
          echo 'task-definition=task-definition.with-hair.json' >> "$GITHUB_OUTPUT"
        id: connect-hair-queue

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.connect-hair-queue.outputs.task-definition || steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Download current hair worker task definition
        if: ${{ steps.resolve-hair.outputs.enabled == 'true' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.resolve-hair.outputs.task-definition }}" \
            --query taskDefinition \
            --output json > hair-task-definition.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' hair-task-definition.raw.json > hair-task-definition.json

      - name: Render hair worker task definition
        if: ${{ steps.resolve-hair.outputs.enabled == 'true' }}
        id: render-hair-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: hair-task-definition.json
          container-name: ${{ env.HAIR_WORKER_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy hair worker ECS service
        if: ${{ steps.resolve-hair.outputs.enabled == 'true' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-hair-task-definition.outputs.task-definition }}
          service: ${{ steps.resolve-hair.outputs.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
